# Smart Gemini: Carbon leads, Argon runs subagents and advises, Hydrogen does the small jobs.
# Opus stays as the cross-vendor reviewer.
modelRoles:
  default: google-antigravity/gemini-4-carbon:medium
  plan: google-antigravity/gemini-4-carbon:high
  slow: google-antigravity/gemini-4-carbon:high
  task: google-antigravity/gemini-4-argon:medium
  smol: google-antigravity/gemini-4-hydrogen:medium,google-antigravity/gemini-4-hydrogen-medium
  writer_cheap: google-antigravity/gemini-4-hydrogen:medium,google-antigravity/gemini-4-hydrogen-medium
  vision: google-antigravity/gemini-4-hydrogen:medium,google-antigravity/gemini-4-hydrogen-medium
  tiny: google-antigravity/gemini-4-hydrogen:low,google-antigravity/gemini-4-hydrogen-low
  commit: google-antigravity/gemini-4-hydrogen:low,google-antigravity/gemini-4-hydrogen-low
  reader_fast: google-antigravity/gemini-4-hydrogen:medium,google-antigravity/gemini-4-hydrogen-medium
  advisor: google-antigravity/gemini-4-argon:medium
  second_opinion: anthropic/claude-opus-5-5:auto
  worker_alt: google-antigravity/gemini-4-argon:high
retry:
  fallbackChains:
    # Argon on OpenCode Go has its own quota, so it still works when
    # Antigravity's shared Gemini quota is used up.
    google-antigravity/gemini-4-hydrogen-low:
      - opencode-go/deepseek-v4.1-flash:high
      - anthropic/claude-sonnet-5-5
    google-antigravity/gemini-4-hydrogen-medium: &h
      - opencode-go/gemini-4-argon:medium
      - opencode-go/deepseek-v4.1-flash:high
      - anthropic/claude-sonnet-5-5
    google-antigravity/gemini-4-hydrogen-high: *h
