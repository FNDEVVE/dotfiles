setupVersion: 2
symbolPreset: nerd
theme:
  dark: dark-lavender
  light: light-monochrome
defaultThinkingLevel: auto
extendedContext: true
steeringMode: all
followUpMode: all
interruptMode: wait
doubleEscapeAction: tree
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  plan: anthropic/claude-fable-5-1:auto
  slow: anthropic/claude-opus-5-5:auto
  task: anthropic/claude-opus-5-5:auto
  smol: anthropic/claude-sonnet-5-5:auto
  tiny: anthropic/claude-haiku-5-5:auto
  vision: anthropic/claude-haiku-5-5:auto
  commit: anthropic/claude-haiku-5-5:auto
  advisor: openai-codex/gpt-6.1-sol:high
  web: web/exa
  judge: typesafe/jev-latest
  reader_fast: anthropic/claude-haiku-5-5:auto
  reader_cheap: opencode-go/deepseek-v4.1-flash:low
  writer_cheap: anthropic/claude-haiku-5-5:auto
  worker_alt: google-antigravity/gemini-4-argon:auto
  second_opinion: google-antigravity/gemini-4-argon:auto
cycleOrder:
  - default
  - plan
  - slow
  - task
  - worker_alt
  - smol
task:
  eager: always
  maxRecursionDepth: -1
  enableLsp: true
  showResolvedModelBadge: true
  isolation:
    enabled: true
    commits: ai
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    scout: "@reader_fast"
    sonic: "@writer_cheap"
    reviewer: "@second_opinion"
    security-reviewer: "@second_opinion"
  maxConcurrency: 64
  maxEffort: xhigh
providers:
  openrouterVariant: floor
  autoThinkingMaxEffort: xhigh
  fetch: firecrawl
  anthropic:
    slowMode: auto
  maxInFlightRequests:
    zai: 8
  openai-codex:
    codeMode: auto
retry:
  fallbackChains:
    google-antigravity/gemini-4-argon:
      - opencode-go/gemini-4-argon-contributor
      - anthropic/claude-opus-5-5
    anthropic/claude-opus-5-5:
      - muse-code/muse-wonder-1.0-contributor
      - anthropic/claude-fable-5-1
      - google-antigravity/gemini-4-argon
      - openai-codex/gpt-6-astra
      - anthropic/claude-sonnet-5-5
      - zai/glm-5.3
    anthropic/claude-fable-5-1:
      - muse-code/muse-wonder-full-1.0-contributor:max
      - anthropic/claude-opus-5-5
      - google-antigravity/gemini-4-argon:high
      - openai-codex/gpt-6-astra
      - zai/glm-5.3
    anthropic/claude-sonnet-5-5:
      - muse-code/muse-wonder-1.0-contributor
      - google-antigravity/gemini-4-argon
      - openai-codex/gpt-6.1-sol
      - zai/glm-5.3
    anthropic/claude-haiku-5-5:
      - google-antigravity/gemini-3.8-flash
      - opencode-go/deepseek-v4.1-flash:low
    openai-codex/gpt-6-astra:
      - muse-code/muse-wonder-1.0-contributor:high
      - google-antigravity/gemini-4-argon:auto
      - anthropic/claude-opus-5-5
      - zai/glm-5.3
    openai-codex/gpt-6.1-sol:
      - google-antigravity/gemini-4-argon:auto
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - zai/glm-5.3
    google-antigravity/gemini-3.8-flash:
      - opencode-go/deepseek-v4.1-flash:low
      - muse-code/muse-wonder-1.0-contributor
      - zai/glm-5.3-flashx:auto
      - zai/glm-5.3-flash:auto
    merge/*:
      - anthropic/claude-opus-5-5
      - google-antigravity/gemini-4-argon:auto
      - anthropic/claude-sonnet-5-5
      - openai-codex/gpt-6.1-sol
      - muse-code/muse-wonder-1.0-contributor
      - zai/glm-5.3-flashx
      - zai/glm-5.3-flash
      - google-antigravity/gemini-3.8-flash
    opencode-go/deepseek-v4.1-flash:
      - ollama-cloud/deepseek-v4.1-flash
      - merge/deepseek-v4.1-flash-merge-particle
      - muse-code/muse-wonder-1.0-contributor
      - google-antigravity/gemini-4-argon
      - openai-codex/gpt-6.1-sol
      - zai/glm-5.3-flashx
      - zai/glm-5.3-flash
      - google-antigravity/gemini-3.8-flash
    zai/glm-5.3:
      - muse-code/muse-wonder-1.0-contributor
      - google-antigravity/gemini-4-argon:auto
      - openai-codex/gpt-6.1-sol
      - anthropic/claude-sonnet-5-5
      - zai/glm-5.3-flashx:max
      - zai/glm-5.3-flash:max
      - google-antigravity/gemini-3.8-flash
    zai/glm-5.3-flash:
      - google-antigravity/gemini-3.8-flash
      - ollama-cloud/glm-5.3-flash
      - opencode-go/deepseek-v4.1-flash
    zai/glm-5.3-flashx:
      - google-antigravity/gemini-3.8-flash
      - ollama-cloud/glm-5.3-flash
      - opencode-go/deepseek-v4.1-flash
    judge:
      - typesafe/jev-preview
      - openrouter/~typesafe/jev-latest
compaction:
  thresholdPercent: 30
  handoffSaveToDisk: true
  keepRecentTokens: 60000
  experimentalContextManagement: true
checkpoint:
  enabled: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
advisor:
  enabled: true
features:
  unexpectedStopDetection: smart
model:
  toolCallLoopGuard:
    threshold: 4
edit:
  blackbox:
    enabled: true
lsp:
  lazy: false
  diagnosticsOnEdit: true
astGrep:
  enabled: true
bashInterceptor:
  enabled: true
github:
  enabled: true
generate_image:
  enabled: true
todo:
  eager: preferred
commands:
  enableOpencodeProject: false
  enableClaudeProject: false
power:
  sleepPrevention: system
dev:
  autoqa: false
  autoqaConsent: granted
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  shimmer: kitt
  pinnedAgents: full
  subagentLivePreview: true
statusLine:
  preset: nerd
  separator: powerline
  compactThinkingLevel: false
composer:
  shape: rule
  tokenRate: true
browser:
  screenshotDir: ~/Desktop/OMPSS
  cmux: false
plan:
  autosave: true
  autosaveDir: ~/Desktop/OMPPP
textVerbosity: low
find:
  enabled: "on"
claudeResets:
  autoRedeem: "no"
disabledProviders:
  - claude-plugins
  - agent-plugins
  - opencode
  - codex
  - claude
  - builtin-defaults
  - omp-managed
tui:
  codexResetFireworks: true
emojiAutocomplete: false
recap:
  idleSeconds: 600
eval:
  autoBackground:
    enabled: true
codexResets:
  autoRedeem: "no"
bash:
  gitGuard: true
