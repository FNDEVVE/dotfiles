setupVersion: 3
symbolPreset: nerd
theme:
  dark: dark-lavender
  light: light-monochrome
defaultThinkingLevel: auto
extendedContext: true
steeringMode: all
followUpMode: all
interruptMode: wait
doubleEscapeAction: tree
modelRoles:
  default: anthropic/claude-opus-5-5:auto
  plan: anthropic/claude-fable-5-2:high
  slow: anthropic/claude-fable-5-2:high
  task: anthropic/claude-opus-5-5:auto
  smol: opencode-go/deepseek-v4.1-flash:high
  writer_cheap: opencode-go/deepseek-v4.1-flash:high
  tiny: anthropic/claude-haiku-5-5:auto
  vision: anthropic/claude-haiku-5-5:auto
  commit: anthropic/claude-haiku-5-5:auto
  reader_fast: opencode-go/deepseek-v4.1-flash:high
  reader_cheap: opencode-go/deepseek-v4.1-flash:low
  advisor: opencode-go/deepseek-v4.1-flash:high
  worker_alt: opencode-go/gemini-4-argon:medium
  second_opinion: opencode-go/gemini-4-argon:high
  web: web/exa
  judge: typesafe/jev-latest
cycleOrder:
  - default
  - slow
  - worker_alt
task:
  eager: always
  maxRecursionDepth: -1
  enableLsp: true
  showResolvedModelBadge: true
  isolation:
    enabled: true
    commits: ai
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    scout: "@reader_fast"
    sonic: "@writer_cheap"
    reviewer: "@second_opinion"
    security-reviewer: "@second_opinion"
  maxConcurrency: 64
  maxEffort: xhigh
providers:
  openrouterVariant: floor
  autoThinkingMaxEffort: xhigh
  fetch: firecrawl
  anthropic:
    slowMode: auto
  maxInFlightRequests:
    zai: 8
retry:
  rateLimitWalksChain: true
  fallbackChains:
    anthropic/claude-fable-5-2:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
    anthropic/claude-opus-5-5:
      - anthropic/claude-sonnet-5-5
      - opencode-go/gemini-4-argon:high
    anthropic/claude-sonnet-5-5:
      - anthropic/claude-haiku-5-5
      - opencode-go/deepseek-v4.1-flash:high
    anthropic/claude-haiku-5-5:
      - opencode-go/claude-haiku-5-5
      - zai/glm-5.3-flash
    opencode-go/gemini-4-argon:
      - opencode-go/deepseek-v4.1-flash:max
    opencode-go/deepseek-v4.1-flash:
      - opencode-go/mimo-v2.6-pro
      - zai/glm-5.3-flash
    zai/glm-5.3-flash:
      - opencode-go/glm-5.3-flash
    judge:
      - typesafe/jev-preview
      - openrouter/~typesafe/jev-latest
compaction:
  thresholdPercent: 30
  handoffSaveToDisk: true
  keepRecentTokens: 60000
  experimentalContextManagement: true
checkpoint:
  enabled: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
advisor:
  enabled: true
features:
  unexpectedStopDetection: smart
model:
  toolCallLoopGuard:
    threshold: 4
edit:
  blackbox:
    enabled: true
lsp:
  lazy: false
  diagnosticsOnEdit: true
astGrep:
  enabled: true
bashInterceptor:
  enabled: true
github:
  enabled: true
generate_image:
  enabled: true
todo:
  eager: preferred
commands:
  enableOpencodeProject: false
  enableClaudeProject: false
power:
  sleepPrevention: system
dev:
  autoqa: false
  autoqaConsent: granted
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  shimmer: kitt
  pinnedAgents: full
  subagentLivePreview: true
statusLine:
  preset: nerd
  separator: powerline
  compactThinkingLevel: false
composer:
  shape: rule
  tokenRate: true
browser:
  screenshotDir: ~/Desktop/OMPSS
  cmux: false
plan:
  autosave: true
  autosaveDir: ~/Desktop/OMPPP
find:
  enabled: "on"
claudeResets:
  autoRedeem5h: "no"
  autoRedeemWeekly: "no"
  autoRedeemFable: "no"
disabledProviders:
  - claude-plugins
  - agent-plugins
  - opencode
  - codex
  - claude
  - builtin-defaults
  - omp-managed
  - ollama-cloud
  - google-antigravity
  - ollama
emojiAutocomplete: false
recap:
  idleSeconds: 600
eval:
  autoBackground:
    enabled: true
bash:
  gitGuard: true
update:
  auto: true
