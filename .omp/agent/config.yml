setupVersion: 2
symbolPreset: nerd
theme:
  dark: dark-lavender
  light: light-monochrome
defaultThinkingLevel: auto
extendedContext: true
readLineNumbers: false
steeringMode: all
followUpMode: all
interruptMode: wait
doubleEscapeAction: tree
modelRoles:
  default: anthropic/claude-opus-5-5:auto
  plan: anthropic/claude-fable-5-1:auto
  slow: anthropic/claude-opus-5-5:auto
  task: anthropic/claude-opus-5-5:auto
  smol: anthropic/claude-sonnet-5-5:auto
  tiny: anthropic/claude-haiku-5-5:auto
  vision: zai/glm-5.3-flash:low
  commit: zai/glm-5.3-flash:low
  advisor: openai-codex/gpt-6.1-sol:high
  web: web/exa
  judge: typesafe/jev-latest
  reader_fast: anthropic/claude-haiku-5-5:auto
  reader_cheap: anthropic/claude-haiku-5-5:auto
  writer_cheap: anthropic/claude-haiku-5-5:auto
  worker_alt: openai-codex/gpt-6.1-sol:auto
  second_opinion: openai-codex/gpt-6.1-sol:auto
cycleOrder:
  - default
  - plan
  - slow
  - task
  - worker_alt
  - smol
task:
  eager: always
  maxRecursionDepth: -1
  enableLsp: true
  showResolvedModelBadge: true
  isolation:
    enabled: true
    commits: ai
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    scout: "@reader_fast"
    sonic: "@writer_cheap"
    reviewer: "@second_opinion"
    security-reviewer: "@second_opinion"
  agentServiceTierOverrides:
    task: priority
    sonic: priority
  maxConcurrency: 64
  softRequestBudget: 200
  maxEffort: xhigh
providers:
  openrouterVariant: floor
  autoThinkingMaxEffort: xhigh
  fetch: firecrawl
  anthropic:
    slowMode: auto
  maxInFlightRequests:
    zai: 8
  openai-codex:
    codeMode: auto
retry:
  fallbackChains:
    anthropic/claude-opus-5-5:
      - anthropic/claude-fable-5-1
      - anthropic/claude-sonnet-5-5
      - openai-codex/gpt-6.1-sol
      - zai/glm-5.3
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6-astra
      - zai/glm-5.3
    openai-codex/gpt-6.1-sol:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - zai/glm-5.3
    google-antigravity/gemini-3.8-flash:
      - ollama-cloud/deepseek-v4.1-flash:low
      - zai/glm-5.3-flash:auto
      - muse-code/muse-spark-1.3-contributor:auto
    ollama-cloud/deepseek-v4.1-flash:
      - opencode-go/deepseek-v4.1-flash
      - merge/deepseek-v4.1-flash-merge-particle
      - google-antigravity/gemini-3.8-flash
    zai/glm-5.3:
      - zai/glm-5.3-flash:max
    zai/glm-5.3-flash:
      - google-antigravity/gemini-3.8-flash
      - merge/glm-5.3-flash-merge-particle
      - ollama-cloud/glm-5.3-flash
    commit:
      []
    judge:
      - typesafe/jev-preview
      - openrouter/~typesafe/jev-latest
compaction:
  thresholdPercent: 30
  handoffSaveToDisk: true
  keepRecentTokens: 60000
  experimentalContextManagement: true
branchSummary:
  enabled: false
checkpoint:
  enabled: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
advisor:
  enabled: true
features:
  unexpectedStopDetection: smart
model:
  toolCallLoopGuard:
    threshold: 4
edit:
  blackbox:
    enabled: true
lsp:
  lazy: false
  diagnosticsOnEdit: true
astGrep:
  enabled: true
bashInterceptor:
  enabled: true
github:
  enabled: true
generate_image:
  enabled: true
read:
  renderMarkdown: false
  summarize:
    prose: false
  toolResultPreview: false
todo:
  eager: preferred
commands:
  enableOpencodeProject: false
  enableClaudeProject: false
power:
  sleepPrevention: system
dev:
  autoqa: false
  autoqaConsent: granted
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  shimmer: kitt
  pinnedAgents: full
  hideToolActivity: false
  subagentLivePreview: true
statusLine:
  preset: nerd
  separator: powerline
  compactThinkingLevel: false
composer:
  shape: rule
  tokenRate: true
browser:
  screenshotDir: ~/Desktop/OMPSS
plan:
  autosave: true
  autosaveDir: ~/Desktop/OMPPP
textVerbosity: low
find:
  enabled: "on"
spelling:
  typoDetection: true
  autocomplete: ngram
colorBlindMode: false
claudeResets:
  autoRedeem: "no"
disabledProviders:
  - claude-plugins
  - agent-plugins
  - opencode
  - codex
  - claude
  - builtin-defaults
  - omp-managed
tier:
  openai: priority
  advisor: priority
tui:
  autoGraph: smart
  codexResetFireworks: true
emojiAutocomplete: false
recap:
  idleSeconds: 600
eval:
  autoBackground:
    enabled: true
codexResets:
  autoRedeem: "no"
